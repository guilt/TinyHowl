[project]
name = "tinyhowl"
version = "0.1.0"
description = "Growable formant mouth for Tiny"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
play = ["simpleaudio"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyhowl*"]
